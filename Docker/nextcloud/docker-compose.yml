services:
  db:
    image: mariadb:10.11
    container_name: nextcloud-db
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    restart: always
    volumes:
      - ./nextcloud_db:/var/lib/mysql
    environment:
      - MARIADB_ROOT_PASSWORD=Jotaro2026
      - MARIADB_PASSWORD=Jotaro2026
      - MARIADB_DATABASE=nextcloud
      - MARIADB_USER=nextcloud


  app:
    image: nextcloud:fpm-alpine
    container_name: nextcloud-app
    restart: always
    depends_on:
      - db
    volumes:
      - ./nextcloud_data:/var/www/html
    environment:
      - MYSQL_PASSWORD=Jotaro2026
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_HOST=db
      # Configuracion critica para evitar "Folder not found"
      - NEXTCLOUD_DATA_DIR=/var/www/html/data
      - NEXTCLOUD_TRUSTED_DOMAINS=192.168.1.50:8080
     # - NEXTCLOUD_TRUSTED_DOMAINS=localhost:8080
      - OVERWRITEPROTOCOL=http
      #peso archivos
      - PHP_UPLOAD_LIMIT=10G
      - PHP_MEMORY_LIMIT=512M

  web:
    image: nginx:alpine
    container_name: nextcloud-web
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nextcloud_data:/var/www/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app