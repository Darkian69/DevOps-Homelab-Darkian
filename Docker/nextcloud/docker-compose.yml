services:
  db:
    image: mariadb:10.11
    container_name: nextcloud-db
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    restart: always
    volumes: #Aca pueden usar volumes de docker o poner el directorio donde trabajar.
      - ./nextcloud_db:/var/lib/mysql
    environment:
      - MARIADB_ROOT_PASSWORD=clavecambiar
      - MARIADB_PASSWORD=Jotaro2026
      - MARIADB_DATABASE=nextcloud
      - MARIADB_USER=nextcloud

  redis:
    image: redis:alpine
    container_name: nextcloud-redis
    restart: always

  app:
    image: nextcloud:fpm-alpine
    container_name: nextcloud-app
    restart: always
    depends_on:
      - db
      - redis
    volumes: #Aca pueden usar volumes de docker o poner el directorio donde trabajar.
      - ./nextcloud_data:/var/www/html
    environment:
      - MYSQL_PASSWORD=clavecambiar
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_HOST=db
      - REDIS_HOST=redis

  web:
    image: nginx:alpine
    container_name: nextcloud-web
    restart: always
    ports:
      - "8080:80" # Usaremos el 8080 para no chocar con el Nginx de prueba
    volumes: #Aca pueden usar volumes de docker o poner el directorio donde trabajar.
      - ./nextcloud_data:/var/www/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

