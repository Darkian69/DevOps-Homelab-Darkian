---
- name: Instalacion Profesional de Docker Engine
  hosts: celeron
  become: yes
  vars:
    docker_packages:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin

  tasks:
    - name: Instalar dependencias previas de Docker
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present

    - name: Crear directorio para llaves de repositorio
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Descargar llave GPG oficial de Docker
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker-archive-keyring.asc
        mode: '0644'

    - name: Configurar el repositorio estable de Docker
      apt_repository:
        repo: >
          deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }} signed-by=/etc/apt/keyrings/docker-archive-keyring.asc]
          https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
        state: present
        filename: docker-main

    - name: Instalar Docker Engine y Plugins
      apt:
        name: "{{ docker_packages }}"
        state: present
        update_cache: yes

    - name: Asegurar que el servicio Docker este corriendo
      service:
        name: docker
        state: started
        enabled: yes

    - name: Agregar usuario al grupo docker (Post-install)
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes
